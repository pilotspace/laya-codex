[package]
name = "laya-model"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native (candle) inference for the Laya typed-decision model: ModernBERT-large + decision head"

[features]
default = []
# Enables the Metal backend (macOS). Off by default so Linux builds stay pure CPU.
metal = ["candle-core/metal", "candle-nn/metal"]
# Apple Accelerate BLAS for the CPU path on macOS.
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]

[dependencies]
laya-core.workspace = true
candle-core = "0.11"
candle-nn = "0.11"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
anyhow.workspace = true
