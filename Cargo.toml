[workspace]
resolver = "3"
members = [
    "crates/laya-core",
    "crates/laya-parse",
    "crates/laya-model",
    "crates/laya-store",
    "crates/laya-rank",
    "crates/laya-cli",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["Tin Dang"]

[workspace.dependencies]
laya-core = { path = "crates/laya-core" }
laya-parse = { path = "crates/laya-parse" }
laya-model = { path = "crates/laya-model" }
laya-store = { path = "crates/laya-store" }
laya-rank = { path = "crates/laya-rank" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
blake3 = "1"
tracing = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwind (not abort) so a panic on a strange input fails one request or index job instead of
# killing the daemon; see CHANGELOG. Costs ~0.9 MB of unwind tables, no measurable runtime.
panic = "unwind"
strip = true
debug = false

# Fast iteration profile that still optimizes dependencies (model math is unusable in debug).
[profile.dev.package."*"]
opt-level = 3
